name: "📊 Allure Report — GitHub Pages"

on:
  workflow_run:
    workflows:
      - "🧪 Selenium Tests"
      - "🔌 API Tests"
      - "🎭 Playwright Tests"
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  allure-report:
    name: "Generate & Publish Allure Report"
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "📥 Download all Allure results"
        uses: actions/download-artifact@v4
        with:
          pattern: "allure-results-*"
          path: allure-results-combined/
          merge-multiple: true
        continue-on-error: true

      - name: "📊 Install Allure CLI"
        run: npm install -g allure-commandline --save-dev

      - name: "📊 Generate Allure Report"
        run: |
          allure generate allure-results-combined --clean -o allure-report || \
          (mkdir -p allure-report && echo "<h1>No test results found</h1>" > allure-report/index.html)

      - name: "🚀 Deploy to GitHub Pages"
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
