name: "🧪 Selenium Tests"

on:
  push:
    branches: [main, develop]
    paths:
      - "tests/**"
      - "utils/**"
      - "requirements.txt"
      - "pytest.ini"
      - ".github/workflows/selenium-tests.yml"
  pull_request:
    branches: [main, develop]
  schedule:
    # Run every weekday at 08:00 UTC (daily regression)
    - cron: "0 8 * * 1-5"
  workflow_dispatch:
    inputs:
      markers:
        description: "pytest markers to run (e.g. smoke, regression)"
        required: false
        default: "smoke"

jobs:
  selenium:
    name: "Selenium — ${{ matrix.browser }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chrome]
        # Add firefox when needed: browser: [chrome, firefox]

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "🐍 Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "📦 Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "🌐 Install Chrome"
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: "🧪 Run Selenium tests"
        env:
          BROWSER: ${{ matrix.browser }}
          HEADLESS: "true"
          SAUCEDEMO_URL: "https://www.saucedemo.com"
          SAUCEDEMO_USER: "standard_user"
          SAUCEDEMO_PASSWORD: "secret_sauce"
          SAUCEDEMO_LOCKED_USER: "locked_out_user"
          EXPLICIT_WAIT: "30"
        run: |
          pytest tests/selenium_tests/tests/ \
            -m "${{ github.event.inputs.markers || 'smoke or regression' }}" \
            --alluredir=allure-results \
            --html=reports/selenium-report.html \
            --self-contained-html \
            --tb=short \
            -v \
            2>/dev/null

      - name: "📋 Test Results Summary"
        if: always()
        run: |
          echo "========================================"
          echo "       TEST RESULTS SUMMARY"
          echo "========================================"
          if [ -f reports/selenium-report.html ]; then
            echo "✅ HTML report generated"
          else
            echo "❌ No HTML report found"
          fi
          echo "Check the uploaded artifacts for detailed results."

      - name: "📊 Upload HTML report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-html-report-${{ matrix.browser }}
          path: reports/selenium-report.html
          retention-days: 30

      - name: "📊 Upload Allure results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-selenium-${{ matrix.browser }}
          path: allure-results/
          retention-days: 30

      - name: "📸 Upload screenshots on failure"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-${{ matrix.browser }}
          path: reports/screenshots/
          retention-days: 7
