name: "🎭 Playwright Tests"

on:
  push:
    branches: [main, develop]
    paths:
      - "tests/playwright_tests/**"
      - "utils/**"
      - "requirements.txt"
      - ".github/workflows/playwright-tests.yml"
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 9 * * 1-5"
  workflow_dispatch:
    inputs:
      browser:
        description: "Browser to run (chromium, firefox, webkit)"
        required: false
        default: "chromium"

jobs:
  playwright:
    name: "Playwright — ${{ matrix.browser }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4

      - name: "🐍 Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "📦 Install Python dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "🎭 Install Playwright browsers"
        run: |
          playwright install ${{ matrix.browser }}
          playwright install-deps ${{ matrix.browser }}

      - name: "🧪 Run Playwright tests"
        env:
          SAUCEDEMO_URL: "https://www.saucedemo.com"
          SAUCEDEMO_USER: "standard_user"
          SAUCEDEMO_PASSWORD: "secret_sauce"
          SAUCEDEMO_LOCKED_USER: "locked_out_user"
          HEADLESS: "true"
        run: |
          pytest tests/playwright_tests/tests/ \
            -m "playwright" \
            --browser ${{ matrix.browser }} \
            --alluredir=allure-results \
            --html=reports/playwright-report-${{ matrix.browser }}.html \
            --self-contained-html \
            --tb=short \
            -v

      - name: "📊 Upload HTML report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-${{ matrix.browser }}
          path: reports/playwright-report-${{ matrix.browser }}.html
          retention-days: 30

      - name: "📊 Upload Allure results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-playwright-${{ matrix.browser }}
          path: allure-results/
          retention-days: 30
