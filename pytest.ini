[pytest]
# ============================================================
# pytest Configuration
# ============================================================

# Make project root importable (fixes 'No module named utils' in CI)
pythonpath = .

# Test discovery
testpaths =
    tests/selenium_tests/tests
    tests/api_tests/tests
    tests/playwright_tests/tests

# Markers
markers =
    smoke: Quick smoke tests (fast)
    regression: Full regression suite
    login: Login-related tests
    cart: Cart and checkout tests
    api: API tests
    playwright: Playwright tests
    skip_ci: Tests that should not run in CI

# Options
addopts =
    -v
    --strict-markers
    --tb=short
    --timeout=60
    --reruns=1
    --reruns-delay=2

# Console output
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Allure report directory
# Run with: pytest --alluredir=allure-results
